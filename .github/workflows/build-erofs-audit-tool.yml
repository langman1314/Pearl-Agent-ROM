name: Build read-only EROFS audit tool

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pearl-erofs-audit-tool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UBUNTU_SNAPSHOT: 20260801T000000Z

    steps:
      - name: Check out Pearl sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned cross-build tools
        run: |
          set -Eeuo pipefail
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          printf '%s\n' \
            'Types: deb' \
            "URIs: https://snapshot.ubuntu.com/ubuntu/${UBUNTU_SNAPSHOT}/" \
            'Suites: noble noble-updates noble-security' \
            'Components: main universe' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/ubuntu-snapshot.sources >/dev/null
          sudo apt-get -o Acquire::Check-Valid-Until=false update
          sudo apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends \
            binutils-mingw-w64-i686 ca-certificates curl diffutils file git \
            g++-mingw-w64-i686-posix make p7zip-full sed tar
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' \
            binutils-mingw-w64-i686 ca-certificates curl diffutils file git \
            g++-mingw-w64-i686-posix make p7zip-full sed tar \
            | sort > host-build-packages.tsv

      - name: Build source-verified extractor twice
        run: |
          set -Eeuo pipefail
          bash scripts/build-erofs-audit-tool.sh \
            --output-dir "$PWD/artifacts/tooling/erofs-audit"

      - name: Record aggregate audit-tool hashes
        run: |
          set -Eeuo pipefail
          cp host-build-packages.tsv artifacts/tooling/erofs-audit/
          find artifacts/tooling/erofs-audit -type f ! -name 'all-files.sha256' -print0 \
            | sort -z \
            | xargs -0 sha256sum > artifacts/tooling/erofs-audit/all-files.sha256
          cat artifacts/tooling/erofs-audit/all-files.sha256

      - name: Upload verified EROFS audit tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pearl-erofs-audit-tool-${{ github.run_id }}
          path: artifacts/tooling/erofs-audit/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
